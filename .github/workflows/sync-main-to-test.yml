name: Sync main → test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    name: Merge main into test
    runs-on: ubuntu-latest

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Create sync branch and open PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git config user.name "avekshak-bot[bot]"
          git config user.email "avekshak-bot[bot]@users.noreply.github.com"

          BRANCH="sync/main-to-test-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git push origin "$BRANCH"

          PR_URL=$(gh pr create \
            --base test \
            --head "$BRANCH" \
            --title "chore: sync main → test" \
            --body "Automated sync of main into test. [skip ci]" \
            --repo "$GITHUB_REPOSITORY")

          echo "PR created: $PR_URL"
          gh pr merge "$PR_URL" --merge --auto --repo "$GITHUB_REPOSITORY"

