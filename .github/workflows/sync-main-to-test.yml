name: Sync main → test

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  sync:
    name: Merge main into test
    runs-on: ubuntu-latest

    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: test
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Merge main into test
        run: |
          git config user.name "avekshak-bot[bot]"
          git config user.email "avekshak-bot[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-ff origin/main -m "chore: sync main → test [skip ci]"
          git push origin test

