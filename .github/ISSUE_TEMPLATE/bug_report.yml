name: Bug Report
description: Something isn't working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: Tell us what you saw...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run service X with config Y
        2. Send event Z
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      render: shell

  - type: dropdown
    id: service
    attributes:
      label: Which service is affected?
      options:
        - ingest
        - fusion
        - correlation
        - agent
        - api
        - web
        - shared/schema
        - other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit SHA
