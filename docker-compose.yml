services:
  postgres:
    image: postgres:16-alpine
    container_name: avekshak-postgres
    environment:
      POSTGRES_USER: avekshak
      POSTGRES_PASSWORD: avekshak
      POSTGRES_DB: avekshak
    ports:
      - "5433:5432"
    volumes:
      - avekshak-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avekshak -d avekshak"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: avekshak-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    container_name: avekshak-ollama
    ports:
      - "11434:11434"
    volumes:
      - avekshak-ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  avekshak-pgdata:
  avekshak-ollama:
